<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>
      Kailas Mutkule | Full-Stack Developer & Computer Engineering Student
    </title>

    <meta
      name="description"
      content="Kailas Mutkule is a Computer Engineering student and Full-Stack Developer skilled in Java, JavaScript, React, Node.js, Express.js, MongoDB, SQL, and web development."
    />

    <!-- Tell search engines the preferred URL -->
    <link rel="canonical" href="https://kailasmutkule.netlify.app/" />

    <!-- Search engine crawling -->
    <meta name="robots" content="index, follow" />

    <!-- Author -->
    <meta name="author" content="Kailas Mutkule" />

    <!-- Theme -->
    <meta name="theme-color" content="#0b1020" />

    <!-- Open Graph / LinkedIn / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Kailas Mutkule | Full-Stack Developer" />

    <meta
      property="og:description"
      content="Official portfolio of Kailas Mutkule — Computer Engineering student and Full-Stack Developer."
    />

    <meta property="og:url" content="https://kailasmutkule.netlify.app/" />

    <meta property="og:site_name" content="Kailas Mutkule Portfolio" />

    <meta
      property="og:image"
      content="https://kailasmutkule.netlify.app/assets/kailas-profile.png"
    />

    <meta
      property="og:image:alt"
      content="Kailas Mutkule - Full-Stack Developer"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Kailas Mutkule | Full-Stack Developer"
    />

    <meta
      name="twitter:description"
      content="Official portfolio of Kailas Mutkule — Computer Engineering student and Full-Stack Developer."
    />

    <meta
      name="twitter:image"
      content="https://kailasmutkule.netlify.app/assets/kailas-profile.png"
    />

    <!-- Structured Data: Person -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://kailasmutkule.netlify.app/#person",
        "name": "Kailas Mutkule",
        "url": "https://kailasmutkule.netlify.app/",
        "image": "https://kailasmutkule.netlify.app/assets/kailas-profile.png",
        "jobTitle": "Full-Stack Developer",
        "description": "Computer Engineering student and Full-Stack Developer interested in building practical web applications.",
        "sameAs": [
          "https://www.linkedin.com/in/kailas-mutkule",
          "https://github.com/kailasmutkule",
          "https://www.instagram.com/kailas_mutkule_18/"
        ]
      }
    </script>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Portfolio CSS -->
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <!-- Main application -->
    <div id="root"></div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- React -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>

    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <!-- Portfolio application -->
    <script src="./app.js"></script>
  </body>
</html>
